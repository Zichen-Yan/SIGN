habitat:
  environment:
    type: gibson
    max_episode_steps: 1000
    iterator_options:
      max_scene_repeat_steps: 50000
  simulator:
    scene:
      "data/scene_datasets/gibson/Ackermanville.glb"
    agent_0:
      sensors: ["rgb_sensor", "depth_sensor"]
    habitat_sim_v0:
      gpu_device_id: 0
    rgb_sensor:
      width: 256
      height: 256
    type:
      'Sim-Drone' # Sim-v0
  task:
    type: Nav-Drone
    end_on_success: True
    reward_measure: "distance_to_goal_reward"
    success_measure: "spl"

    sensors: ['imagegoal_sensor']

    measurements: ["distance_to_goal", "success", "spl", "soft_spl", "distance_to_goal_reward"]
    success:
      success_distance: 1.0

  dataset:
    type: ImageNav-v1
    split: train
    data_path: data/datasets/imagenav/gibson/v1/{split}/{split}.json.gz
