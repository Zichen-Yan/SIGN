habitat:
  environment:
    type: mp3d
    max_episode_steps: 500
  simulator:
    scene:
      "data/scene_datasets/mp3d/ARNzJeq3xxb/ARNzJeq3xxb.glb"
    agent_0:
      sensors: ['rgb_sensor', "depth_sensor"]
    habitat_sim_v0:
      gpu_device_id: 0
    rgb_sensor:
      width: 256
      height: 256
    type:
      'Sim-Drone' # Sim-v0
  task:
    type: Nav-Drone
    end_on_success: True
    reward_measure: "distance_to_goal_reward"
    success_measure: "spl"

    sensors: ['imagegoal_sensor']

    measurements: ["distance_to_goal", "success", "spl", "soft_spl", "distance_to_goal_reward"]
    success:
      success_distance: 1.0
  dataset:
    type: ImageNav-v1
    split: train
    data_path: data/datasets/imagenav/mp3d/v1/{split}/{split}.json.gz